# The fork's releases (docs/fork/README.md): a v<versionName> tag whose version has "-fork." in it,
# e.g. v1.3.2-fork.1. Upstream's release.yml is switched off on the fork (it deploys upstream's website
# and signs with upstream's key); this one signs with the fork's own key and publishes
# PokeDaisy-Fork-<tag>.apk as the latest release, which the in-app updater and Obtainium follow.
# Nothing is published unless:
#   - the tag is on main and matches versionName in app/build.gradle.kts,
#   - the whole CI suite passes on the tagged commit,
#   - the APK's package and label are the fork's,
#   - the APK is signed with the fork's key (its certificate matches POKEDAISY_FORK_RELEASE_CERT_SHA256).
name: Fork release

on:
  push:
    tags: ['v*-fork.*']

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE: io.github.enchyrn.pokedaisy
  LABEL: PokeDaisy Fork

jobs:
  verify:
    name: Tag is on main and matches versionName
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} doesn't match versionName ${version}"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${tag} isn't on main - release from main only"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, sign and publish
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Signing key (from secrets, never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.POKEDAISY_FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POKEDAISY_FORK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POKEDAISY_FORK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POKEDAISY_FORK_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!v}" || { echo "::error::secret POKEDAISY_FORK_${v} isn't set (scripts/fork/create-release-key.sh)"; exit 1; }
          done
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.p12"
          {
            echo "storeFile=${RUNNER_TEMP}/release.p12"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: The fork's package, label and key
        env:
          RELEASE_CERT_SHA256: ${{ vars.POKEDAISY_FORK_RELEASE_CERT_SHA256 }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)"
          badging="$("${tools}aapt2" dump badging "${apk}")"
          echo "${badging}" | grep -q "^package: name='${PACKAGE}'" || { echo "::error::APK isn't package ${PACKAGE}"; exit 1; }
          echo "${badging}" | grep -q "^application-label:'${LABEL}'" || { echo "::error::APK isn't labelled ${LABEL}"; exit 1; }
          # Android only installs an update signed with the installed app's key: a release signed with
          # any other key would strand every installed copy, so an unset fingerprint is an error too.
          if ! [[ "${RELEASE_CERT_SHA256}" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo "::error::variable POKEDAISY_FORK_RELEASE_CERT_SHA256 isn't set as keytool prints it (AA:BB:...)"; exit 1
          fi
          certs="$("${tools}apksigner" verify --print-certs "${apk}")"
          want="$(echo "${RELEASE_CERT_SHA256}" | tr -d ':' | tr 'A-F' 'a-f')"
          echo "${certs}" | grep -qi "SHA-256 digest: ${want}" || { echo "::error::APK isn't signed with the fork's key"; exit 1; }
          echo "Signed with ${RELEASE_CERT_SHA256}"
          mkdir -p dist
          cp "${apk}" "dist/PokeDaisy-Fork-${GITHUB_REF_NAME}.apk"

      # A full release, not a pre-release: the in-app updater skips pre-releases.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PokeDaisy Fork ${{ env.VERSION }}
          files: dist/PokeDaisy-Fork-${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: false
          make_latest: true

      - name: Clean up the key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.p12" keystore.properties
